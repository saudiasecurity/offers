*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14.5px/1.6 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2E8BB8;outline-offset:2px;border-radius:6px}
.hidden{display:none !important}
a{color:var(--guard)}

/* top */
.top{background:linear-gradient(90deg,var(--guard-deep),#123A5F);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1280px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:14px}
.top .mark{width:34px;height:36px;flex:none;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.login .mark{display:block;width:58px;height:62px;background:linear-gradient(150deg,var(--guard-2),var(--guard-deep) 70%);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.top b{font-weight:700;font-size:15.5px;display:block;line-height:1.45}
.top span.sub{font-size:12.5px;color:#AFC6DA;display:block;line-height:1.45}
.top nav{display:flex;gap:2px;margin-inline-start:28px;height:100%}
.top nav button{background:none;border:0;color:#C7D8E8;padding:0 14px;height:100%;cursor:pointer;font-weight:500;position:relative}
.top nav button[aria-current="page"]{color:#fff;font-weight:600}
.top nav button[aria-current="page"]::after{content:"";position:absolute;inset-inline:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#C9A24B}
.top .acts{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;height:36px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.tbtn:hover{background:rgba(255,255,255,.18)}
.sync{font-size:12px;color:#9DB7CF}

<script>
const CONFIG = { SUPABASE_URL: "https://nkbihualrgevkvyvoihl.supabase.co", SUPABASE_KEY: "sb_publishable_7fyrOlq0HhZP7bxXr2d4jw_WaCBzP_b" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function settingsGaps() {
  const s = D.settings, g = [];
  if (!s.start_date) g.push("تاريخ المباشرة"); if (!s.contract_duration) g.push("مدة العقد"); if (!s.deadline) g.push("آخر موعد للرد"); if (!s.hr_phone) g.push("رقم شؤون الموظفين");
  return g;
}
function counts(list) { const c = { pend: 0, view: 0, acc: 0, done: 0, rej: 0, exp: 0 }; list.forEach(e => c[stateOf(e)]++); return c; }
const ORDER = ["done", "acc", "view", "pend", "rej"];
function stackBar(c, cls = "sbar") { const tot = Object.values(c).reduce((a, b) => a + b, 0) || 1; const cc = { ...c, pend: c.pend + c.exp };
  return `<div class="${cls}">${ORDER.map(k => cc[k] ? `<i class="${ST[k].col}" style="width:${cc[k] / tot * 100}%" title="${ST[k].t}: ${cc[k]}"></i>` : "").join("")}</div>`; }

function filtered() {
  const q = toLatin(UI.q).trim();
  return D.employees.filter(e => {
    if (UI.branch && e.branch !== UI.branch) return false;
    if (UI.state === "badphone") { if (phoneOk(e.phone)) return false; }
    else if (UI.state) { const st = stateOf(e); if (UI.state === "pend" ? !(st === "pend" || st === "exp") : st !== UI.state) return false; }
    if (q && !(e.full_name.includes(q) || e.national_id.includes(q) || digits(e.phone).includes(digits(q) || "§"))) return false;
    return true;
  });
}

function confirmModal(title, body, label, fn, danger) {

  const wrap = document.createElement("div"); wrap.innerHTML = `<div class="scrim"></div><div class="modal"><div class="box" role="dialog" aria-modal="true"><h3>${title}</h3><p>${body}</p><div class="row"><button class="btn btn-line" data-no>رجوع</button><button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-yes>${label}</button></div></div></div>`;

/* ===== import ===== */
const COLS = [["national_id", ["رقم الهوية", "الهوية", "national_id"]], ["full_name", ["الاسم", "اسم الفرد", "full_name"]], ["phone", ["الجوال", "رقم الجوال", "phone"]], ["branch", ["الفرع", "الموقع", "branch"]], ["city", ["المدينة", "city"]], ["job_title", ["المسمى", "المسمى الوظيفي", "التصنيف الوظيفي", "job_title"]], ["salary_total", ["الراتب", "الراتب الشهري", "الراتب الشهري (ريال)", "salary_total"]]];
function mapRows(aoa) {
  const head = aoa[0].map(h => String(h ?? "").trim()); const idx = {};
  COLS.forEach(([k, names]) => { const i = head.findIndex(h => names.includes(h)); if (i >= 0) idx[k] = i; });
  const hasHead = Object.keys(idx).length >= 3;
  const body = hasHead ? aoa.slice(1) : aoa;
  if (!hasHead) COLS.forEach(([k], i) => idx[k] = i);
  return body.filter(r => r.some(c => String(c ?? "").trim())).map(r => {
    const o = {}; COLS.forEach(([k]) => o[k] = idx[k] !== undefined ? String(r[idx[k]] ?? "").trim() : "");
    o.national_id = digits(o.national_id); o.phone = digits(o.phone); o.salary_total = digits(o.salary_total) || (TITLES[o.job_title] ? String(TITLES[o.job_title]) : "");
    return o;
  });
}

  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="scrim"></div><div class="modal"><div class="box" role="dialog" aria-modal="true"><h3>استيراد موظفين</h3>
    <p>ارفع ملف Excel أو الصق الصفوف من Excel. الأعمدة بالترتيب: رقم الهوية، الاسم، الجوال، الفرع، المدينة، المسمى، الراتب. إذا وُجد رقم الهوية مسبقاً يُحدَّث عرضه.</p>
    <input type="file" id="impFile" accept=".xlsx,.xls,.csv" class="input" style="padding-top:6px">
    <label class="f" for="impText" style="margin-top:12px">أو الصق هنا</label><textarea class="input num" id="impText" style="text-align:right"></textarea>
    <div id="impPrev" class="fhint"></div>
    <div class="row"><button class="btn btn-line" data-no>إلغاء</button><button class="btn btn-primary" id="impGo" disabled>استيراد</button></div></div></div>`;
  $("#layer").appendChild(wrap);
  let rows = [];
  const prev = () => { const ok = rows.filter(r => /^[12]\d{9}$/.test(r.national_id) && r.full_name && r.branch && r.job_title && r.salary_total);
    $("#impPrev").innerHTML = rows.length ? `${ok.length} صفاً جاهزاً${rows.length - ok.length ? `، و${rows.length - ok.length} ناقصة ستُتجاهل` : ""}.` : ""; $("#impGo").disabled = !ok.length; };
  $("#impText").oninput = () => { rows = mapRows($("#impText").value.split(/\r?\n/).map(l => l.split("\t"))); prev(); };
  $("#impFile").onchange = async ev => { const f = ev.target.files[0]; if (!f || !window.XLSX) return; const wb = XLSX.read(await f.arrayBuffer()); const ws = wb.Sheets[wb.SheetNames[0]];
    let aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false }); const hi = aoa.findIndex(r => r.some(c => ["رقم الهوية", "الاسم", "national_id"].includes(String(c).trim()))); if (hi > 0) aoa = aoa.slice(hi); rows = mapRows(aoa); prev(); };
  wrap.querySelector("[data-no]").onclick = () => wrap.remove();
  $("#impGo").onclick = async () => { $("#impGo").disabled = true; const r = await api("jo_admin_import", { p_code: CODE, p_rows: rows });
    if (r.ok) { wrap.remove(); toast(`أُضيف ${r.inserted} وحُدّث ${r.updated}${r.errors.length ? `، وتُجاهل ${r.errors.length}` : ""}`); await load(); } };
}

/* ===== send ===== */
const offerURL = () => { if (window.JO_DEMO_LINK) return window.JO_DEMO_LINK; const u = new URL(location.href); u.hash = ""; u.search = ""; u.pathname = u.pathname.replace(/admin\.html$/, ""); return u.toString(); };
function groupMsg() {
  const s = D.settings, dl = s.deadline ? `\nآخر موعد للرد: ${fmtG(parseDate(s.deadline))}.` : "";
  return `السلام عليكم ورحمة الله وبركاته،\nيسر ${s.company_name} إبلاغكم بصدور العروض الوظيفية لـ${s.project_name}.\n\nللاطلاع على عرضك والرد عليه افتح الرابط التالي:\n${offerURL()}\n\nادخل برقم هويتك وآخر 4 أرقام من جوالك المسجل.${dl}${s.hr_phone ? `\nللاستفسار: ${s.hr_phone}` : ""}`;
}
function personalMsg(e) {
  const s = D.settings, dl = s.deadline ? `\nآخر موعد للرد: ${fmtG(parseDate(s.deadline))}.` : "";
  return `السلام عليكم ${e.full_name.split(" ")[0]}،\nيسر ${s.company_name} أن تقدم لك عرضاً وظيفياً بمسمى ${e.job_title} في ${e.branch} ضمن ${s.project_name}.\n\nللاطلاع على العرض والرد عليه:\n${offerURL()}\n\nادخل برقم هويتك وآخر 4 أرقام من جوالك (${phone10(e.phone).slice(-4)}).${dl}`;
}
const waLink = e => `https://wa.me/${intl(e.phone)}?text=${encodeURIComponent(personalMsg(e))}`;
function renderSend() {
  const sent = ls.get("jo_sent") || {}, f = UI.sendFilter;
  const L = D.employees.filter(e => f === "all" ? true : f === "pend" ? ["pend", "exp"].includes(stateOf(e)) : f === "view" ? stateOf(e) === "view" : f === "acc" ? stateOf(e) === "acc" : true);
  $("#t-send").innerHTML = `${settingsGaps().length ? `<div class="alert warn">أكمل إعدادات العرض قبل الإرسال: ${settingsGaps().join("، ")}.<button class="btn btn-line btn-sm" onclick="UI.tab='settings';render()">فتح الإعدادات</button></div>` : ""}
    <div class="grid2"><div class="stack">
      <div class="card"><h2>رابط العروض</h2><p class="lead" style="margin:-6px 0 12px">رابط واحد لكل الموظفين؛ كل موظف يرى عرضه فقط بعد التحقق من هويته.</p>
        <div class="linkbox"><input class="input" readonly value="${esc(offerURL())}" id="lnk"><button class="btn btn-primary" id="cpLink">نسخ الرابط</button></div></div>
      <div class="card"><h2>رسالة جماعية</h2><p class="lead" style="margin:-6px 0 12px">للصقها في قائمة بث أو مجموعة واتساب، أو إرسالها رسالة نصية.</p>
        <textarea class="input" id="gmsg" style="min-height:190px">${esc(groupMsg())}</textarea>
        <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" id="cpMsg">نسخ الرسالة</button><a class="btn btn-wa" id="waGroup" target="_blank" rel="noopener">مشاركة عبر واتساب</a></div></div>
      <div class="card"><h2>إرسال فردي عبر واتساب <small>يفتح محادثة الموظف برسالة جاهزة باسمه</small></h2>
        <div class="toolbar" style="margin-bottom:8px"><select class="input" id="sf"><option value="pend">لم يفتحوا العرض</option><option value="view">فتحوا ولم يردوا</option><option value="acc">وافقوا ولم يكملوا البيانات</option><option value="all">الجميع</option></select><span class="count">${L.length} موظف</span></div>
        <div style="max-height:520px;overflow:auto"><table class="sendlist"><tbody>${L.map(e => `<tr class="${sent[e.id] ? "sent" : ""}"><td><b>${esc(e.full_name)}</b><div style="font-size:12.5px;color:var(--muted)">${esc(e.branch)}</div></td><td class="num">${esc(phone10(e.phone))}</td>
          <td style="text-align:left">${phoneOk(e.phone) ? `<a class="btn btn-wa btn-sm" data-sid="${e.id}" target="_blank" rel="noopener" href="${waLink(e)}">${sent[e.id] ? "أُرسل — إعادة" : "إرسال"}</a>` : `<span class="flag">الجوال غير مكتمل</span>`}</td></tr>`).join("") || `<tr><td style="color:var(--muted);padding:20px;text-align:center">لا يوجد أحد في هذه القائمة.</td></tr>`}</tbody></table></div></div>
    </div>
    <div class="card"><h2>رمز QR</h2><p class="lead" style="margin:-6px 0 12px">اطبعه وعلّقه في المواقع ليمسحه الموظفون بكاميرا الجوال.</p>
      <div class="qr"><div class="code" id="qrc"></div><div style="display:grid;gap:8px"><button class="btn btn-line" id="qrSvg">تنزيل SVG</button><button class="btn btn-line" id="qrPng">تنزيل PNG</button></div></div></div></div>`;
  $("#cpLink").onclick = () => copy(offerURL(), "تم نسخ الرابط");
  $("#cpMsg").onclick = () => copy($("#gmsg").value, "تم نسخ الرسالة");
  const setWa = () => $("#waGroup").href = "https://wa.me/?text=" + encodeURIComponent($("#gmsg").value); setWa(); $("#gmsg").oninput = setWa;
  $("#sf").value = f; $("#sf").onchange = ev => { UI.sendFilter = ev.target.value; renderSend(); };
  $("#t-send").querySelectorAll("[data-sid]").forEach(a => a.addEventListener("click", () => { const s = ls.get("jo_sent") || {}; s[a.dataset.sid] = Date.now(); ls.set("jo_sent", s); a.closest("tr").classList.add("sent"); a.textContent = "أُرسل — إعادة"; }));
  drawQR();
}
function drawQR() {
  const host = $("#qrc"); if (!host) return;
  if (!window.qrcode) { setTimeout(drawQR, 400); return; }
  const qr = qrcode(0, "M"); qr.addData(offerURL()); qr.make();
  const svg = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); host.innerHTML = svg;
  const file = (blob, name) => { if (window.JO_DEMO_NO_DOWNLOAD) { toast("التنزيل يعمل في النسخة الفعلية، ومعطّل في هذه المعاينة."); return; } const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $("#qrSvg").onclick = () => file(new Blob([svg], { type: "image/svg+xml" }), "job-offer-qr.svg");
  $("#qrPng").onclick = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 1024; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 1024, 1024); x.drawImage(img, 0, 0, 1024, 1024); c.toBlob(b => file(b, "job-offer-qr.png")); }; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg ", '<svg width="1024" height="1024" ')); };
}

/* ===== settings ===== */
function renderSettings() {
  const s = D.settings;
  $("#t-settings").innerHTML = `<div class="grid2"><form class="card" id="sf2"><h2>إعدادات العرض</h2><p class="lead" style="margin:-6px 0 16px">تظهر هذه البيانات في عرض كل موظف، وأي تعديل يظهر فوراً.</p>
      <div id="sAlert"></div>
      <div class="fgrid">
        <div><label class="f" for="s1">اسم الشركة</label><input class="input" id="s1" value="${esc(s.company_name)}"></div>
        <div><label class="f" for="s2">اسم المشروع</label><input class="input" id="s2" value="${esc(s.project_name)}"></div>
        <div><label class="f" for="s3">تاريخ المباشرة</label><input class="input" type="date" id="s3" value="${esc(s.start_date || "")}"></div>
        <div><label class="f" for="s4">مدة العقد</label><input class="input" id="s4" list="durs" placeholder="مثال: سنة واحدة قابلة للتجديد" value="${esc(s.contract_duration || "")}"><datalist id="durs"><option value="سنة واحدة قابلة للتجديد"><option value="سنتان قابلة للتجديد"><option value="مدة المشروع"><option value="6 أشهر قابلة للتجديد"></datalist></div>
        <div><label class="f" for="s5">آخر موعد للرد</label><input class="input" type="date" id="s5" value="${esc(s.deadline || "")}"><span class="fhint">بعد نهاية هذا اليوم يُقفل الرد تلقائياً.</span></div>
        <div><label class="f" for="s6">رقم شؤون الموظفين</label><input class="input num" id="s6" maxlength="10" placeholder="05xxxxxxxx" value="${esc(s.hr_phone || "")}"><span class="fhint">يظهر للموظف للاستفسار.</span></div>
        <div class="full"><label class="f" for="s7">نص الترحيب في خطاب العرض</label><textarea class="input" id="s7" style="min-height:130px">${esc(s.welcome_text || "")}</textarea><span class="fhint">يأتي بعد «السلام عليكم ورحمة الله وبركاته، وبعد:» وقبل تفاصيل العرض.</span></div>
      </div>
      <div style="margin-top:16px"><button class="btn btn-primary" type="submit">حفظ الإعدادات</button></div></form>
    <form class="card" id="cf"><h2>رمز دخول اللوحة</h2><p class="lead" style="margin:-6px 0 16px">غيّره بعد أول دخول، ولا تشاركه إلا مع من يحتاج متابعة الردود.</p><div id="cAlert"></div>
      <label class="f" for="c1">الرمز الجديد</label><input class="input num" id="c1" type="password" autocomplete="new-password" minlength="10">
      <label class="f" for="c2" style="margin-top:12px">تأكيد الرمز الجديد</label><input class="input num" id="c2" type="password" autocomplete="new-password">
      <span class="fhint">10 أحرف على الأقل.</span>
      <div style="margin-top:16px"><button class="btn btn-line" type="submit">تغيير الرمز</button></div></form></div>`;
  $("#sf2").onsubmit = async ev => { ev.preventDefault();
    const hp = digits($("#s6").value); if (hp && !/^0\d{8,9}$/.test(hp)) { $("#sAlert").innerHTML = `<div class="alert err">رقم شؤون الموظفين غير صحيح.</div>`; return; }
    const r = await api("jo_admin_save_settings", { p_code: CODE, p_s: { company_name: $("#s1").value, project_name: $("#s2").value, start_date: $("#s3").value, contract_duration: $("#s4").value, deadline: $("#s5").value, hr_phone: hp, welcome_text: $("#s7").value } });
    if (r.ok) { toast("تم حفظ الإعدادات"); await load(); } };
  $("#cf").onsubmit = async ev => { ev.preventDefault(); const a = $("#c1").value, b = $("#c2").value;
    if (a.length < 10) { $("#cAlert").innerHTML = `<div class="alert err">الرمز 10 أحرف على الأقل.</div>`; return; }
    if (a !== b) { $("#cAlert").innerHTML = `<div class="alert err">الرمزان غير متطابقين.</div>`; return; }
    const r = await api("jo_admin_change_code", { p_code: CODE, p_new: a }); if (r.ok) { CODE = a; ss.set("jo_admin", a); $("#cAlert").innerHTML = `<div class="alert ok">تم تغيير الرمز. استخدم الرمز الجديد في المرات القادمة.</div>`; $("#c1").value = $("#c2").value = ""; } };
}

/* ===== export ===== */
$("#exportBtn").onclick = () => {
  if (window.JO_DEMO_NO_DOWNLOAD) { toast("تصدير Excel يعمل في النسخة الفعلية، والتنزيل معطّل في هذه المعاينة."); return; }
  if (!window.XLSX || !D) { toast("لحظة، جارٍ تجهيز التصدير…"); return; }
  const rows = D.employees.map((e, i) => { const d = e.data || {}; return {
    "م": i + 1, "الفرع": e.branch, "المدينة": e.city || "", "الاسم": e.full_name, "رقم الهوية": e.national_id, "الجوال المسجل": phone10(e.phone), "المسمى": e.job_title, "الراتب الإجمالي": Number(e.salary_total),
    "الحالة": ST[stateOf(e)].t, "أول فتح": e.first_viewed_at ? fmtDT(e.first_viewed_at) : "", "تاريخ الرد": e.responded_at ? fmtDT(e.responded_at) : "", "سبب الاعتذار": e.reject_reason || "", "ملاحظة الاعتذار": e.reject_note || "",
    "الرقم المرجعي": e.ref_no || "", "تاريخ إرسال البيانات": e.data_submitted_at ? fmtDT(e.data_submitted_at) : "",
    "الجوال (المحدث)": d.mobile || "", "اسم القريب": d.relative_name || "", "صلة القرابة": d.relative_relation || "", "جوال القريب": d.relative_phone || "",
    "الآيبان": d.iban || "", "البنك": d.bank_name || "", "تاريخ الميلاد": dobText(d), "فصيلة الدم": d.blood_type || "", "الحالة الاجتماعية": d.marital_status || "", "عدد الأبناء": d.marital_status ? d.children_count : "",
    "مدينة السكن": d.address_city || "", "الحي": d.address_district || "", "الشارع": d.address_street || "", "رقم المبنى": d.address_building || "", "الرمز البريدي": d.address_postal || "", "العنوان المختصر": d.address_short || "" }; });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = Object.keys(rows[0] || {}).map(k => ({ wch: ["الاسم", "الآيبان", "الحالة"].includes(k) ? 28 : k.length < 6 ? 10 : 16 }));
  const branches = [...new Set(D.employees.map(e => e.branch))];
  const sum = branches.map(b => { const L = D.employees.filter(e => e.branch === b), k = counts(L); return { "الفرع": b, "الموظفون": L.length, "لم يفتح": k.pend + k.exp, "فتح ولم يرد": k.view, "وافق": k.acc + k.done, "مكتمل": k.done, "اعتذر": k.rej }; });
  const ws2 = XLSX.utils.json_to_sheet(sum); ws2["!cols"] = [{ wch: 22 }, ...Array(6).fill({ wch: 12 })];
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, "الردود"); XLSX.utils.book_append_sheet(wb, ws2, "ملخص الفروع");
  XLSX.writeFile(wb, `SS_Job_Offers_Responses_${new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Riyadh" }).format(new Date())}.xlsx`);
};

if (CODE) boot();
</script>
</body>
</html>
